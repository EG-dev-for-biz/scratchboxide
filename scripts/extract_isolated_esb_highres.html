<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Extract Isolated High-Res Empire State Building</title>
    <script type="importmap">
    {
        "imports": {
            "three": "/node_modules/three/build/three.module.js",
            "three/addons/": "/node_modules/three/examples/jsm/",
            "3d-tiles-renderer": "/node_modules/3d-tiles-renderer/build/index.js",
            "3d-tiles-renderer/plugins": "/node_modules/3d-tiles-renderer/build/index.plugins.js"
        }
    }
    </script>
</head>
<body style="margin: 0; background: #0f172a; color: #f8fafc; font-family: -apple-system, sans-serif; padding: 24px;">
    <h2>Google 3D Tiles: Full-Quality Isolated Empire State Building Extractor</h2>
    <div id="status" style="font-size: 16px; color: #38bdf8; margin-bottom: 12px; font-weight: 600;">Initializing high-resolution extraction...</div>
    <div id="phase" style="font-size: 14px; color: #fbbf24; margin-bottom: 12px;">Phase: Streaming Leaf LOD...</div>
    <div id="stats" style="font-family: monospace; font-size: 12px; white-space: pre; background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #334155; max-width: 600px;"></div>
    <div id="container" style="width: 1024px; height: 768px; margin-top: 15px; border: 1px solid #334155; border-radius: 8px; overflow: hidden;"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { TilesRenderer } from '3d-tiles-renderer';
        import { GoogleCloudAuthPlugin } from '3d-tiles-renderer/plugins';

        const statusEl = document.getElementById('status');
        const phaseEl = document.getElementById('phase');
        const statsEl = document.getElementById('stats');
        const container = document.getElementById('container');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        // Framed to capture the full 443m elevation profile from ground to antenna tip
        const camera = new THREE.PerspectiveCamera(55, 1024 / 768, 1, 15000);
        camera.position.set(220, 220, 260);
        camera.lookAt(0, 200, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(1024, 768);
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 2.0);
        light.position.set(100, 300, 100);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));

        // Empire State Building GPS & ENU Local Tangent Plane
        const ESB_LAT = 40.7484405;
        const ESB_LNG = -73.9856644;
        const ESB_ALT = 0.0;
        const GEOID_HEIGHT = -30.0;

        const WGS84_A = 6378137.0;
        const WGS84_F = 1.0 / 298.257223563;
        const WGS84_B = WGS84_A * (1.0 - WGS84_F);
        const WGS84_E2 = (WGS84_A * WGS84_A - WGS84_B * WGS84_B) / (WGS84_A * WGS84_A);

        const latRad = ESB_LAT * (Math.PI / 180);
        const lngRad = ESB_LNG * (Math.PI / 180);
        const altEllipsoid = ESB_ALT + GEOID_HEIGHT;

        const sinLat = Math.sin(latRad);
        const cosLat = Math.cos(latRad);
        const sinLng = Math.sin(lngRad);
        const cosLng = Math.cos(lngRad);

        const n = WGS84_A / Math.sqrt(1.0 - WGS84_E2 * sinLat * sinLat);
        const x = (n + altEllipsoid) * cosLat * cosLng;
        const y = (n + altEllipsoid) * cosLat * sinLng;
        const z = ((1.0 - WGS84_E2) * n + altEllipsoid) * sinLat;

        const m00 = -sinLng;
        const m01 = cosLng;
        const m02 = 0;
        const m03 = -(m00 * x + m01 * y + m02 * z);

        const m10 = cosLat * cosLng;
        const m11 = cosLat * sinLng;
        const m12 = sinLat;
        const m13 = -(m10 * x + m11 * y + m12 * z);

        const m20 = sinLat * cosLng;
        const m21 = sinLat * sinLng;
        const m22 = -cosLat;
        const m23 = -(m20 * x + m21 * y + m22 * z);

        const localMatrix = new THREE.Matrix4();
        localMatrix.set(
            m00, m01, m02, m03,
            m10, m11, m12, m13,
            m20, m21, m22, m23,
            0,   0,   0,   1
        );

        statusEl.innerText = "Connecting to Google 3D Tiles API with errorTarget = 0.5 (Maximum Quality)...";

        const tiles = new TilesRenderer();
        const auth = new GoogleCloudAuthPlugin({
            apiToken: 'AIzaSyCSHRfQGTmZykmM4LA6mI7avjEQEkQive4',
            autoRefreshToken: true,
            useRecommendedSettings: false
        });
        tiles.registerPlugin(auth);

        tiles.group.matrix.copy(localMatrix);
        tiles.group.matrixAutoUpdate = false;
        scene.add(tiles.group);

        tiles.setCamera(camera);
        // Calculate SSE against a 4K viewport to demand highest leaf tiles
        tiles.setResolution(camera, 3840, 2160);
        // Error target 0.5 drives deepest available LOD octree traversal
        tiles.errorTarget = 0.5;

        window.tiles = tiles;
        window.isExtractionComplete = false;
        window.extractionResult = null;

        let stableFrames = 0;
        let lastLoadedCount = 0;
        let hasTriggeredExport = false;

        function animate() {
            requestAnimationFrame(animate);

            camera.updateMatrixWorld();
            tiles.setCamera(camera);
            tiles.setResolution(camera, 3840, 2160);
            tiles.update();

            renderer.render(scene, camera);

            const stats = tiles.stats;
            statsEl.innerText = JSON.stringify(stats, null, 2);

            if (stats.loaded > 0) {
                statusEl.innerText = `Streaming full-quality leaf tiles... Loaded: ${stats.loaded}, Downloading: ${stats.downloading}, Parsing: ${stats.parsing}`;

                if (stats.downloading === 0 && stats.parsing === 0 && stats.loaded >= 20) {
                    if (stats.loaded === lastLoadedCount) {
                        stableFrames++;
                    } else {
                        stableFrames = 0;
                        lastLoadedCount = stats.loaded;
                    }

                    phaseEl.innerText = `Phase: Settling at Leaf LOD (${stableFrames}/120 frames)...`;

                    if (stableFrames > 120 && !hasTriggeredExport) {
                        hasTriggeredExport = true;
                        phaseEl.innerText = "Phase: Isolating Empire State Building Triangles...";
                        statusEl.innerText = "Leaf LOD Streamed! Running Building Isolation Filter...";
                        extractIsolatedEsbGLB();
                    }
                } else {
                    stableFrames = 0;
                }
            }
        }

        // Check if triangle centroid lies within Empire State Building setback volume
        function isTriangleInESB(cx, cy, cz) {
            if (cy < -2.0) return false;

            // Spire & Antenna (Y > 330m)
            if (cy > 330.0) {
                return (cx >= -25.0 && cx <= 25.0 && cz >= -25.0 && cz <= 25.0);
            }

            // Upper Setbacks & 86th/102nd floors (Y: 250m - 330m)
            if (cy > 250.0) {
                return (cx >= -38.0 && cx <= 38.0 && cz >= -34.0 && cz <= 30.0);
            }

            // Main Tower Shaft (Y: 100m - 250m)
            if (cy > 100.0) {
                return (cx >= -55.0 && cx <= 40.0 && cz >= -35.0 && cz <= 30.0);
            }

            // Lower Setback (Y: 40m - 100m)
            if (cy > 40.0) {
                return (cx >= -80.0 && cx <= 40.0 && cz >= -38.0 && cz <= 34.0);
            }

            // Base Podium & Ground Entrances (Y: -2m - 40m)
            // Fifth Ave (+40m), 34th St (-38m), 33rd St (+34m), West property line (-100m)
            return (cx >= -100.0 && cx <= 40.0 && cz >= -38.0 && cz <= 34.0);
        }

        async function extractIsolatedEsbGLB() {
            try {
                tiles.group.updateMatrixWorld(true);

                const exportGroup = new THREE.Group();
                exportGroup.name = "Empire_State_Building_Isolated_Full_Quality";

                let keptMeshes = 0;
                let keptTris = 0;
                let keptVerts = 0;
                let totalExaminedMeshes = 0;

                const tempV0 = new THREE.Vector3();
                const tempV1 = new THREE.Vector3();
                const tempV2 = new THREE.Vector3();

                tiles.group.traverse((node) => {
                    if (node.isMesh && node.geometry) {
                        totalExaminedMeshes++;
                        node.updateMatrixWorld(true);
                        const geom = node.geometry;
                        const posAttr = geom.getAttribute('position');
                        const normAttr = geom.getAttribute('normal');
                        const uvAttr = geom.getAttribute('uv');
                        const indexAttr = geom.getIndex();

                        if (!posAttr) return;

                        const worldMat = node.matrixWorld;
                        const triCount = indexAttr ? (indexAttr.count / 3) : (posAttr.count / 3);

                        // Arrays for isolated triangles
                        const newPositions = [];
                        const newNormals = normAttr ? [] : null;
                        const newUvs = uvAttr ? [] : null;

                        for (let t = 0; t < triCount; t++) {
                            const i0 = indexAttr ? indexAttr.getX(t * 3) : (t * 3);
                            const i1 = indexAttr ? indexAttr.getX(t * 3 + 1) : (t * 3 + 1);
                            const i2 = indexAttr ? indexAttr.getX(t * 3 + 2) : (t * 3 + 2);

                            tempV0.fromBufferAttribute(posAttr, i0).applyMatrix4(worldMat);
                            tempV1.fromBufferAttribute(posAttr, i1).applyMatrix4(worldMat);
                            tempV2.fromBufferAttribute(posAttr, i2).applyMatrix4(worldMat);

                            const cx = (tempV0.x + tempV1.x + tempV2.x) / 3.0;
                            const cy = (tempV0.y + tempV1.y + tempV2.y) / 3.0;
                            const cz = (tempV0.z + tempV1.z + tempV2.z) / 3.0;

                            if (isTriangleInESB(cx, cy, cz)) {
                                newPositions.push(
                                    tempV0.x, tempV0.y, tempV0.z,
                                    tempV1.x, tempV1.y, tempV1.z,
                                    tempV2.x, tempV2.y, tempV2.z
                                );

                                if (newNormals && normAttr) {
                                    const n0 = new THREE.Vector3().fromBufferAttribute(normAttr, i0).transformDirection(worldMat);
                                    const n1 = new THREE.Vector3().fromBufferAttribute(normAttr, i1).transformDirection(worldMat);
                                    const n2 = new THREE.Vector3().fromBufferAttribute(normAttr, i2).transformDirection(worldMat);
                                    newNormals.push(
                                        n0.x, n0.y, n0.z,
                                        n1.x, n1.y, n1.z,
                                        n2.x, n2.y, n2.z
                                    );
                                }

                                if (newUvs && uvAttr) {
                                    newUvs.push(
                                        uvAttr.getX(i0), uvAttr.getY(i0),
                                        uvAttr.getX(i1), uvAttr.getY(i1),
                                        uvAttr.getX(i2), uvAttr.getY(i2)
                                    );
                                }
                            }
                        }

                        // If triangles were kept, create isolated mesh
                        if (newPositions.length > 0) {
                            const isolatedGeom = new THREE.BufferGeometry();
                            isolatedGeom.setAttribute('position', new THREE.Float32BufferAttribute(newPositions, 3));
                            if (newNormals) {
                                isolatedGeom.setAttribute('normal', new THREE.Float32BufferAttribute(newNormals, 3));
                            } else {
                                isolatedGeom.computeVertexNormals();
                            }
                            if (newUvs) {
                                isolatedGeom.setAttribute('uv', new THREE.Float32BufferAttribute(newUvs, 2));
                            }

                            // Clone material with original photogrammetric texture
                            let isolatedMat;
                            if (Array.isArray(node.material)) {
                                isolatedMat = node.material.map(m => m.clone());
                            } else if (node.material) {
                                isolatedMat = node.material.clone();
                            } else {
                                isolatedMat = new THREE.MeshStandardMaterial({ color: 0xd4d4d8 });
                            }

                            const isolatedMesh = new THREE.Mesh(isolatedGeom, isolatedMat);
                            isolatedMesh.name = `ESB_Isolated_Submesh_${keptMeshes}`;
                            exportGroup.add(isolatedMesh);

                            keptMeshes++;
                            const subTris = newPositions.length / 9;
                            keptTris += subTris;
                            keptVerts += newPositions.length / 3;
                        }
                    }
                });

                console.log(`Isolated ESB: Kept ${keptMeshes} submeshes, ${keptTris} triangles, ${keptVerts} vertices from ${totalExaminedMeshes} tile nodes!`);
                statusEl.innerText = `Isolated ESB: ${keptMeshes} submeshes (${keptTris} triangles, ${keptVerts} vertices). Exporting to GLB...`;
                phaseEl.innerText = "Phase: Exporting Isolated GLB...";

                const exporter = new GLTFExporter();
                exporter.parse(
                    exportGroup,
                    async (glbBuffer) => {
                        console.log(`Isolated GLB export succeeded! Size: ${glbBuffer.byteLength} bytes.`);
                        statusEl.innerText = `Saving Isolated GLB to server (${(glbBuffer.byteLength / 1024 / 1024).toFixed(2)} MB)...`;

                        const res = await fetch('/api/save_glb?file=public/models/spce_esb_isolated_full_quality_raw.glb', {
                            method: 'POST',
                            body: glbBuffer
                        });
                        const resJson = await res.json();

                        statusEl.innerHTML = `<span style="color:#4ade80; font-weight:700;">✓ Isolated Empire State Building Saved Successfully! (${(glbBuffer.byteLength / 1024 / 1024).toFixed(2)} MB, ${keptTris.toLocaleString()} tris)</span>`;
                        phaseEl.innerText = "Phase: Complete!";
                        window.isExtractionComplete = true;
                        window.extractionResult = {
                            ok: true,
                            keptMeshes,
                            keptTris,
                            keptVerts,
                            bytes: glbBuffer.byteLength
                        };
                    },
                    (error) => {
                        console.error("GLTFExporter error:", error);
                        statusEl.innerText = `GLTFExporter error: ${error.message}`;
                        window.isExtractionComplete = true;
                        window.extractionResult = { ok: false, error: error.message };
                    },
                    { binary: true }
                );

            } catch (err) {
                console.error("Isolation extraction error:", err);
                statusEl.innerText = `Isolation extraction failed: ${err.message}`;
                window.isExtractionComplete = true;
                window.extractionResult = { ok: false, error: error.message };
            }
        }

        animate();
    </script>
</body>
</html>
