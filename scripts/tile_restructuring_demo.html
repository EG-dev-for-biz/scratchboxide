<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratchbox IDE - 3D Tile Restructurer</title>
    <style>
        :root {
            --bg-color: #050811;
            --dock-bg: rgba(13, 19, 36, 0.82);
            --dock-border: rgba(255, 255, 255, 0.12);
            --accent-cyan: #38bdf8;
            --accent-blue: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --------------------------------------------------------------------
           Top Navigation Island (Ultra-Clean Floating Glass Bar)
        -------------------------------------------------------------------- */
        .top-nav {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }

        .top-nav > * {
            pointer-events: auto;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--dock-bg);
            border: 1px solid var(--dock-border);
            border-radius: 12px;
            padding: 6px 10px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.01em;
            padding-right: 6px;
            border-right: 1px solid rgba(255, 255, 255, 0.12);
        }

        .brand-sparkle {
            color: var(--accent-cyan);
            font-size: 13px;
        }

        .landmark-selector {
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            padding: 2px 4px;
        }

        .landmark-selector option {
            background: #0f172a;
            color: #f1f5f9;
        }

        .search-mini {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 2px 8px;
            height: 28px;
            transition: all 0.2s;
        }

        .search-mini:focus-within {
            border-color: var(--accent-cyan);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }

        .search-mini input {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 11.5px;
            outline: none;
            width: 170px;
            transition: width 0.2s;
        }

        .search-mini input:focus {
            width: 220px;
        }

        .search-mini input::placeholder {
            color: var(--text-muted);
        }

        .search-mini button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            padding: 0 2px;
        }

        .search-mini button:hover {
            color: #fff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .segmented-group {
            display: flex;
            background: var(--dock-bg);
            border: 1px solid var(--dock-border);
            border-radius: 12px;
            padding: 4px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        }

        .seg-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .seg-btn:hover {
            color: #fff;
        }

        .seg-btn.active {
            background: rgba(56, 189, 248, 0.18);
            color: var(--accent-cyan);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .icon-btn {
            background: var(--dock-bg);
            border: 1px solid var(--dock-border);
            border-radius: 12px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.25);
        }

        .icon-btn.active {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.15);
        }

        /* --------------------------------------------------------------------
           Bottom Floating Prompt Dock (The Interactive Centerpiece)
        -------------------------------------------------------------------- */
        .dock-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: min(780px, calc(100vw - 36px));
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .dock-container > * {
            pointer-events: auto;
        }

        .dock-presets {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .preset-pill {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            font-size: 10.5px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: all 0.18s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .preset-pill:hover {
            background: rgba(56, 189, 248, 0.16);
            border-color: rgba(56, 189, 248, 0.4);
            color: #fff;
            transform: translateY(-1px);
        }

        .preset-pill.active {
            background: rgba(56, 189, 248, 0.22);
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
        }

        .dock-main {
            background: var(--dock-bg);
            border: 1px solid var(--dock-border);
            border-radius: 18px;
            padding: 10px 14px;
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prompt-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .prompt-sparkle {
            color: var(--accent-cyan);
            font-size: 16px;
            margin-left: 4px;
        }

        .prompt-input {
            flex: 1;
            height: 38px;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            outline: none;
        }

        .prompt-input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            height: 38px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            white-space: nowrap;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.55);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit.loading {
            opacity: 0.75;
            cursor: wait;
        }

        .dock-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10.5px;
            color: var(--text-muted);
            padding: 0 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 6px;
        }

        .dock-meta-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dock-meta-right {
            display: flex;
            align-items: center;
            gap: 8px;
            font-variant-numeric: tabular-nums;
        }

        .meta-tag {
            color: #94a3b8;
        }

        .meta-val {
            color: #e2e8f0;
            font-weight: 600;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            display: inline-block;
        }

        .status-dot.busy {
            background: #f59e0b;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
    </style>
    <!-- Three.js + OrbitControls + GLTFLoader -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <!-- Top Navigation Island -->
    <header class="top-nav">
        <div class="nav-left">
            <div class="brand-badge">
                <span class="brand-sparkle">✦</span> Scratchbox 3D
            </div>
            
            <select class="landmark-selector" id="landmark-select" onchange="onLandmarkSelect(this.value)">
                <option value="colosseum" selected>🏛️ Colosseum, Rome</option>
                <option value="sf_ferry">⛵ SF Ferry Building</option>
                <option value="esb">🏙️ Empire State Building</option>
                <option value="synthetic">🏔️ Synthetic Hillside</option>
            </select>

            <div class="search-mini">
                <input type="text" id="query-input" placeholder="Query address or landmark..." onkeydown="if(event.key==='Enter') onSearchQuery()">
                <button onclick="onSearchQuery()">↵</button>
            </div>
        </div>

        <div class="nav-right">
            <!-- Restructured vs Raw View -->
            <div class="segmented-group">
                <button class="seg-btn active" id="btn-view-restructured" onclick="switchView('restructured')">✦ Restructured</button>
                <button class="seg-btn" id="btn-view-raw" onclick="switchView('original')">Raw Tile</button>
            </div>

            <!-- Clay vs PBR Material -->
            <div class="segmented-group">
                <button class="seg-btn active" id="btn-mode-clay" onclick="setMaterialMode('clay')">🗿 Studio Clay</button>
                <button class="seg-btn" id="btn-mode-pbr" onclick="setMaterialMode('pbr')">🎨 PBR</button>
            </div>

            <!-- Wireframe Toggle -->
            <button class="icon-btn" id="btn-wireframe" onclick="toggleWireframe()" title="Toggle Wireframe">🕸️</button>
        </div>
    </header>

    <!-- Bottom Floating Command Dock -->
    <div class="dock-container">
        <!-- Style Presets Quick Pills -->
        <div class="dock-presets">
            <button class="preset-pill active" id="pill-brand-new" onclick="selectPreset('brand_new')">
                ✨ Restored Brand-New
            </button>
            <button class="preset-pill" id="pill-solarpunk" onclick="selectPreset('solarpunk')">
                🌞 Solarpunk Citadel
            </button>
            <button class="preset-pill" id="pill-acropolis" onclick="selectPreset('acropolis')">
                🏛️ Classical Acropolis
            </button>
            <button class="preset-pill" id="pill-brutalist" onclick="selectPreset('brutalist')">
                🏰 Brutalist Fortress
            </button>
            <button class="preset-pill" id="pill-gothic" onclick="selectPreset('gothic')">
                ⛪ Gothic Spires
            </button>
        </div>

        <!-- The Central Prompt Bar -->
        <div class="dock-main">
            <div class="prompt-bar">
                <span class="prompt-sparkle">✦</span>
                <input type="text" id="prompt-input" class="prompt-input" placeholder="Describe architectural restructuring, terraforming, or primitives to graft..." onkeydown="if(event.key==='Enter') executePrompt()">
                <button class="btn-submit" id="btn-submit" onclick="executePrompt()">
                    <span>⚡ Restructure</span>
                </button>
            </div>

            <div class="dock-footer">
                <div class="dock-meta-left">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="footer-status">Ready • Colosseum, Rome</span>
                </div>
                <div class="dock-meta-right">
                    <span class="meta-tag">Verts:</span> <span class="meta-val" id="meta-verts">347,680</span>
                    <span class="meta-tag">Tris:</span> <span class="meta-val" id="meta-tris">210,219</span>
                    <span class="meta-tag">Latency:</span> <span class="meta-val" id="meta-latency" style="color: #10b981;">62ms C++20</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --------------------------------------------------------------------
        // WebGL Viewport Setup (Fullscreen)
        // --------------------------------------------------------------------
        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060913);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 110, 190);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 30, 0);
        controls.maxPolarAngle = Math.PI * 0.49;
        controls.minDistance = 10;
        controls.maxDistance = 800;

        // Radiometric Lighting & Shadow Dome
        const hemiLight = new THREE.HemisphereLight(0xb1e1ff, 0x384152, 0.75);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
        sunLight.position.set(60, 130, 70);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 1.0;
        sunLight.shadow.camera.far = 500;
        const shadowSize = 140;
        sunLight.shadow.camera.left = -shadowSize;
        sunLight.shadow.camera.right = shadowSize;
        sunLight.shadow.camera.top = shadowSize;
        sunLight.shadow.camera.bottom = -shadowSize;
        sunLight.shadow.bias = -0.0004;
        scene.add(sunLight);

        const gridHelper = new THREE.GridHelper(300, 60, 0x1e293b, 0x0f172a);
        gridHelper.position.y = -0.2;
        scene.add(gridHelper);

        const rootGroup = new THREE.Group();
        scene.add(rootGroup);

        const gltfLoader = new GLTFLoader();

        // --------------------------------------------------------------------
        // State Machine
        // --------------------------------------------------------------------
        let currentLandmark = 'colosseum'; // 'colosseum' | 'sf_ferry' | 'esb' | 'synthetic' | 'custom'
        let currentMaterialMode = 'clay';  // 'clay' | 'pbr'
        let viewMode = 'restructured';     // 'restructured' | 'original'
        let isWireframe = false;
        let activeCustomGlbUrl = null;
        let activeLandmarkName = 'Colosseum, Rome';

        const PRESET_PROMPTS = {
            brand_new: "Restructure this tile as the colosseum is brand-new",
            solarpunk: "Restructure into an ancient solarpunk citadel: terrace the hillside with 4 stepped tiers, level a wide sun plaza, and place 4 solar obelisks at perimeter corners and a central bio-dome",
            acropolis: "Restructure into an imperial classical acropolis: level a grand marble plinth, construct an 8-column circular colonnade in the center, and graft stepped temple tiers",
            brutalist: "Turn this into a brutalist fortress massing: carve a perimeter moat trench, excavate a sunken central courtyard, and graft heavy monolithic pylons",
            gothic: "Restructure into gothic cathedral ruins: excavate a deep sunken basin, place 4 soaring needle spires at the perimeter, and construct pointed archway portals"
        };

        const TELEMETRY_CACHE = {
            colosseum: {
                restructured: { verts: '347,680', tris: '210,219', latency: '62ms C++20' },
                original: { verts: '234,679', tris: '170,802', latency: '47ms C++20' }
            },
            sf_ferry: {
                restructured: { verts: '28,269', tris: '14,224', latency: '5.4ms C++20' },
                original: { verts: '28,004', tris: '13,920', latency: '4.1ms C++20' }
            },
            esb: {
                restructured: { verts: '28,500', tris: '14,288', latency: '6.8ms C++20' },
                original: { verts: '28,004', tris: '13,920', latency: '4.3ms C++20' }
            }
        };

        function getGlbCandidates(filename) {
            return [
                `models/${filename}`,
                `./models/${filename}`,
                `/models/${filename}`,
                `http://127.0.0.1:5173/models/${filename}`,
                `http://localhost:5173/models/${filename}`
            ];
        }

        function applyMaterialMode(obj) {
            obj.traverse(child => {
                if (child.isMesh && child.material) {
                    child.castShadow = true;
                    child.receiveShadow = true;

                    if (currentMaterialMode === 'clay') {
                        if (!child.userData.origMat) child.userData.origMat = child.material;
                        child.material = new THREE.MeshStandardMaterial({
                            color: (currentLandmark === 'colosseum') ? 0xdcd6cd : 0xe2ded6,
                            roughness: 0.85,
                            metalness: 0.02,
                            wireframe: isWireframe
                        });
                    } else {
                        if (child.userData.origMat) child.material = child.userData.origMat;
                        child.material.wireframe = isWireframe;
                    }
                }
            });
        }

        function loadModel() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('footer-status');
            statusDot.className = 'status-dot busy';
            statusText.textContent = `Loading ${activeLandmarkName}...`;

            while (rootGroup.children.length > 0) {
                rootGroup.remove(rootGroup.children[0]);
            }

            let filename = '';
            let candidates = [];

            if (currentLandmark === 'custom' && activeCustomGlbUrl) {
                filename = activeCustomGlbUrl.split('/').pop();
                candidates = [activeCustomGlbUrl, ...getGlbCandidates(filename)];
            } else if (currentLandmark === 'colosseum') {
                filename = (viewMode === 'original') ? 'colosseum_clay.glb' : 'colosseum_restructured_brand_new.glb';
                candidates = getGlbCandidates(filename);
            } else if (currentLandmark === 'sf_ferry') {
                filename = (viewMode === 'original') ? 'sf_ferry_raw.glb' : 'sf_ferry_solarpunk.glb';
                candidates = getGlbCandidates(filename);
            } else if (currentLandmark === 'esb') {
                filename = (viewMode === 'original') ? 'esb_clay.glb' : 'esb_clay.glb';
                candidates = getGlbCandidates(filename);
            } else {
                // Synthetic fallback
                buildSyntheticTile();
                return;
            }

            let candidateIdx = 0;
            function tryLoad() {
                if (candidateIdx >= candidates.length) {
                    buildSyntheticTile();
                    return;
                }
                const url = candidates[candidateIdx++];
                gltfLoader.load(
                    url,
                    (gltf) => {
                        while (rootGroup.children.length > 0) rootGroup.remove(rootGroup.children[0]);
                        const model = gltf.scene;
                        applyMaterialMode(model);
                        rootGroup.add(model);

                        const bbox = new THREE.Box3().setFromObject(model);
                        const center = new THREE.Vector3();
                        bbox.getCenter(center);
                        const size = new THREE.Vector3();
                        bbox.getSize(size);

                        controls.target.set(center.x, center.y, center.z);
                        const maxDim = Math.max(size.x, size.y, size.z);
                        camera.position.set(center.x, center.y + maxDim * 0.75, center.z + maxDim * 1.25);
                        controls.update();

                        statusDot.className = 'status-dot';
                        statusText.textContent = `Ready • ${activeLandmarkName} (${currentMaterialMode.toUpperCase()})`;

                        // Update telemetry
                        const t = TELEMETRY_CACHE[currentLandmark]?.[viewMode] || TELEMETRY_CACHE.colosseum.restructured;
                        document.getElementById('meta-verts').textContent = t.verts;
                        document.getElementById('meta-tris').textContent = t.tris;
                        document.getElementById('meta-latency').textContent = t.latency;

                        window.__STUDIO_READY__ = true;
                    },
                    undefined,
                    () => { tryLoad(); }
                );
            }
            tryLoad();
        }

        function buildSyntheticTile() {
            while (rootGroup.children.length > 0) rootGroup.remove(rootGroup.children[0]);
            const geo = new THREE.PlaneGeometry(48, 48, 40, 40);
            geo.rotateX(-Math.PI / 2);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                pos.setY(i, 4.0 * Math.exp(-((x * x + z * z) / 120.0)) + 0.8 * Math.sin(x * 0.3) * Math.cos(z * 0.3));
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ color: 0xdcd6cd, roughness: 0.85, metalness: 0.02, wireframe: isWireframe });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            rootGroup.add(mesh);

            controls.target.set(0, 4, 0);
            camera.position.set(0, 45, 75);
            controls.update();

            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('footer-status');
            statusDot.className = 'status-dot';
            statusText.textContent = 'Ready • Synthetic Hillside Tile';
        }

        // --------------------------------------------------------------------
        // Public Window Handlers
        // --------------------------------------------------------------------
        window.onLandmarkSelect = function(val) {
            currentLandmark = val;
            if (val === 'colosseum') activeLandmarkName = 'Colosseum, Rome';
            else if (val === 'sf_ferry') activeLandmarkName = 'San Francisco Ferry Building';
            else if (val === 'esb') activeLandmarkName = 'Empire State Building';
            else activeLandmarkName = 'Synthetic Hillside';

            loadModel();
        };

        window.onSearchQuery = async function() {
            const q = document.getElementById('query-input').value.trim();
            if (!q) return;

            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('footer-status');
            statusDot.className = 'status-dot busy';
            statusText.textContent = `Querying 3D tile for "${q}"...`;

            try {
                const res = await fetch(`/api/3d/tiles/query?q=${encodeURIComponent(q)}`);
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);

                activeCustomGlbUrl = data.glbUrl;
                activeLandmarkName = data.landmarkName || q;
                currentLandmark = 'custom';

                TELEMETRY_CACHE.custom = {
                    restructured: {
                        verts: Number(data.mesh.vertexCount).toLocaleString(),
                        tris: Number(data.mesh.triangleCount).toLocaleString(),
                        latency: '48ms C++20'
                    },
                    original: {
                        verts: Number(data.mesh.vertexCount).toLocaleString(),
                        tris: Number(data.mesh.triangleCount).toLocaleString(),
                        latency: '48ms C++20'
                    }
                };

                loadModel();
            } catch (err) {
                console.warn('Search query failed:', err);
                statusDot.className = 'status-dot';
                statusText.textContent = `Search error: ${err.message}`;
            }
        };

        window.selectPreset = function(key) {
            document.querySelectorAll('.preset-pill').forEach(p => p.classList.remove('active'));
            const el = document.getElementById(`pill-${key.replace('_', '-')}`);
            if (el) el.classList.add('active');

            const promptText = PRESET_PROMPTS[key] || '';
            document.getElementById('prompt-input').value = promptText;
            window.executePrompt();
        };

        window.executePrompt = async function() {
            const prompt = document.getElementById('prompt-input').value.trim();
            if (!prompt) return;

            const btn = document.getElementById('btn-submit');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('footer-status');

            btn.classList.add('loading');
            btn.querySelector('span').textContent = '⚡ Restructuring...';
            statusDot.className = 'status-dot busy';
            statusText.textContent = `Running C++20 Astro pipeline: "${prompt.slice(0, 40)}..."`;

            let inputGlb = 'models/colosseum_clay.glb';
            if (currentLandmark === 'sf_ferry') inputGlb = 'models/sf_ferry_raw.glb';
            else if (currentLandmark === 'esb') inputGlb = 'models/esb_clay.glb';
            else if (currentLandmark === 'custom' && activeCustomGlbUrl) inputGlb = activeCustomGlbUrl;

            try {
                const res = await fetch('/api/3d/tiles/restructure', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt,
                        inputGlb,
                        materialMode: currentMaterialMode
                    })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Failed');

                activeCustomGlbUrl = data.glbUrl;
                currentLandmark = 'custom';
                viewMode = 'restructured';

                document.getElementById('btn-view-restructured').classList.add('active');
                document.getElementById('btn-view-raw').classList.remove('active');

                if (data.telemetry) {
                    TELEMETRY_CACHE.custom = {
                        restructured: {
                            verts: Number(data.telemetry.outputVertices).toLocaleString(),
                            tris: Number(data.telemetry.outputTriangles).toLocaleString(),
                            latency: `${data.telemetry.processingTimeMs.toFixed(1)}ms C++20`
                        }
                    };
                }

                loadModel();
            } catch (err) {
                console.warn('Restructure error:', err);
                statusText.textContent = `Restructure error: ${err.message}`;
            } finally {
                btn.classList.remove('loading');
                btn.querySelector('span').textContent = '⚡ Restructure';
            }
        };

        window.setMaterialMode = function(mode) {
            currentMaterialMode = mode;
            document.getElementById('btn-mode-clay').classList.toggle('active', mode === 'clay');
            document.getElementById('btn-mode-pbr').classList.toggle('active', mode === 'pbr');
            applyMaterialMode(rootGroup);
            const statusText = document.getElementById('footer-status');
            statusText.textContent = `Ready • ${activeLandmarkName} (${mode.toUpperCase()})`;
        };

        window.toggleWireframe = function() {
            isWireframe = !isWireframe;
            document.getElementById('btn-wireframe').classList.toggle('active', isWireframe);
            rootGroup.traverse(c => {
                if (c.isMesh && c.material) c.material.wireframe = isWireframe;
            });
        };

        window.switchView = function(mode) {
            viewMode = mode;
            document.getElementById('btn-view-restructured').classList.toggle('active', mode === 'restructured');
            document.getElementById('btn-view-raw').classList.toggle('active', mode === 'original');
            loadModel();
        };

        // Initialize default landing state
        document.getElementById('prompt-input').value = PRESET_PROMPTS.brand_new;
        loadModel();

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
