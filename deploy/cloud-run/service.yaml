apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: scratchbox-tile-cleanup
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/scratchbox-tile-cleanup:latest
        ports:
        - name: http1
          containerPort: 3001
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: HOST
          value: "0.0.0.0"
        - name: SCRATCHBOX_WORKSPACE_ROOTS
          value: "/workspace"
        startupProbe:
          httpGet:
            path: /api/3d/tiles/status
            port: 3001
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          periodSeconds: 15
