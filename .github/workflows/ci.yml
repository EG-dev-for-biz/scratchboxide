name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/brand/**'
      - 'ScratchboxIDE logo/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/brand/**'
      - 'ScratchboxIDE logo/**'
  workflow_dispatch:
  # Nightly: the macOS whole-suite job and the Docker image builds, which pull requests skip.
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ubuntu-24.04 runner of a private repository has 2 vCPUs: vitest runs one test file at a time there, and renders
  # headless Chrome and compiles C++ several times slower than on macOS, so the whole suite takes over two hours. Ubuntu
  # typechecks, lints and builds once and runs the tests in ten shards split by measured time (vitest --shard, split by
  # vitest.shard-sequencer.ts): the slowest file alone in one, about 14 minutes of tests in each other, so that a runner
  # a third slower than the one measured still ends inside the limit. These run on every pull request and push.
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Typecheck, lint, build (ubuntu-24.04)', checks: true, test: false, shard: '' }
          - { name: 'Test (ubuntu-24.04, shard 1/10)', checks: false, test: true, shard: '1/10' }
          - { name: 'Test (ubuntu-24.04, shard 2/10)', checks: false, test: true, shard: '2/10' }
          - { name: 'Test (ubuntu-24.04, shard 3/10)', checks: false, test: true, shard: '3/10' }
          - { name: 'Test (ubuntu-24.04, shard 4/10)', checks: false, test: true, shard: '4/10' }
          - { name: 'Test (ubuntu-24.04, shard 5/10)', checks: false, test: true, shard: '5/10' }
          - { name: 'Test (ubuntu-24.04, shard 6/10)', checks: false, test: true, shard: '6/10' }
          - { name: 'Test (ubuntu-24.04, shard 7/10)', checks: false, test: true, shard: '7/10' }
          - { name: 'Test (ubuntu-24.04, shard 8/10)', checks: false, test: true, shard: '8/10' }
          - { name: 'Test (ubuntu-24.04, shard 9/10)', checks: false, test: true, shard: '9/10' }
          - { name: 'Test (ubuntu-24.04, shard 10/10)', checks: false, test: true, shard: '10/10' }
    uses: ./.github/workflows/verify.yml
    with:
      os: ubuntu-24.04
      checks: ${{ matrix.checks }}
      test: ${{ matrix.test }}
      shard: ${{ matrix.shard }}

  # The macos-15 runner takes four test files at a time, so the whole suite fits one job there. macOS runners are the
  # scarcest, and the Ubuntu shards above already run the whole suite, so pull requests skip this job (2026-11-03, the
  # user's call when CI queued for hours); pushes to main, the nightly run and manual runs keep it.
  verify-macos:
    name: Typecheck, lint, test (macos-15)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/verify.yml
    with:
      os: macos-15
      checks: true
      test: true

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    needs: verify
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build standalone app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: scratchbox-ide:ci

      - name: Build inference sidecar image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.inference
          push: false
          tags: scratchbox-inference:ci
