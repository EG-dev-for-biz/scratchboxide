    /* ==========================================================================
       3. 6-DOF Camera & Smooth Flight System
       ========================================================================== */
    class CameraController {
        constructor() {
            this.mode = 'orbit';
            this.fov = 62.0;

            this.target = [0, 2.2, 0];
            this.radius = 6.8;
            this.theta = 0.55;
            this.phi = 1.38;

            this.pos = [0, 2.2, 6.8];
            this.vel = [0, 0, 0];
            this.yaw = 0.0;
            this.pitch = 0.0;

            this.keys = {};
            this.isDragging = false;
            this.lastMouse = [0, 0];

            this.setupEvents();
        }

        setupEvents() {
            window.addEventListener('keydown', (e) => {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) {
                    return;
                }
                this.keys[e.code] = true;
                if (e.code === 'KeyF') {
                    toggleCameraMode();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) {
                    return;
                }
                this.keys[e.code] = false;
            });

            canvas.addEventListener('mousedown', (e) => {
                this.isDragging = true;
                this.lastMouse = [e.clientX, e.clientY];
            });

            window.addEventListener('mouseup', () => {
                this.isDragging = false;
            });

            window.addEventListener('mousemove', (e) => {
                if (!this.isDragging) return;
                const dx = e.clientX - this.lastMouse[0];
                const dy = e.clientY - this.lastMouse[1];
                this.lastMouse = [e.clientX, e.clientY];

                if (this.mode === 'orbit') {
                    this.theta -= dx * 0.0055;
                    this.phi = Math.max(0.1, Math.min(Math.PI * 0.48, this.phi - dy * 0.0055));
                } else {
                    this.yaw -= dx * 0.0035;
                    this.pitch = Math.max(-1.45, Math.min(1.45, this.pitch - dy * 0.0035));
                }
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (this.mode === 'orbit') {
                    this.radius = Math.max(0.4, Math.min(25.0, this.radius + e.deltaY * 0.01));
                } else {
                    const forward = this.getForwardVector();
                    const boost = -e.deltaY * 0.018;
                    this.vel[0] += forward[0] * boost;
                    this.vel[1] += forward[1] * boost;
                    this.vel[2] += forward[2] * boost;
                }
            }, { passive: false });

            let touchDist = 0;
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    this.isDragging = true;
                    this.lastMouse = [e.touches[0].clientX, e.touches[0].clientY];
                } else if (e.touches.length === 2) {
                    touchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && this.isDragging) {
                    const dx = e.touches[0].clientX - this.lastMouse[0];
                    const dy = e.touches[0].clientY - this.lastMouse[1];
                    this.lastMouse = [e.touches[0].clientX, e.touches[0].clientY];
                    this.theta -= dx * 0.006;
                    this.phi = Math.max(0.1, Math.min(Math.PI * 0.48, this.phi - dy * 0.006));
                } else if (e.touches.length === 2) {
                    const newDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    this.radius = Math.max(0.4, Math.min(25.0, this.radius - (newDist - touchDist) * 0.02));
                    touchDist = newDist;
                }
            });

            canvas.addEventListener('touchend', () => {
                this.isDragging = false;
            });
        }

        getForwardVector() {
            const cosP = Math.cos(this.pitch);
            return [
                Math.sin(this.yaw) * cosP,
                Math.sin(this.pitch),
                -Math.cos(this.yaw) * cosP
            ];
        }

        getRightVector() {
            return [
                Math.cos(this.yaw),
                0,
                Math.sin(this.yaw)
            ];
        }

        update(dt) {
            if (this.mode === 'orbit') {
                const cx = this.target[0] + this.radius * Math.sin(this.phi) * Math.sin(this.theta);
                const cy = this.target[1] + this.radius * Math.cos(this.phi);
                const cz = this.target[2] + this.radius * Math.sin(this.phi) * Math.cos(this.theta);

                this.vel[0] = (cx - this.pos[0]) / Math.max(dt, 0.001);
                this.vel[1] = (cy - this.pos[1]) / Math.max(dt, 0.001);
                this.vel[2] = (cz - this.pos[2]) / Math.max(dt, 0.001);

                this.pos[0] = cx;
                this.pos[1] = cy;
                this.pos[2] = cz;
            } else {
                const forward = this.getForwardVector();
                const right = this.getRightVector();

                const speed = (this.keys['ShiftLeft'] || this.keys['ShiftRight']) ? 14.0 : 5.8;
                const accel = [0, 0, 0];

                if (this.keys['KeyW']) {
                    accel[0] += forward[0] * speed;
                    accel[1] += forward[1] * speed;
                    accel[2] += forward[2] * speed;
                }
                if (this.keys['KeyS']) {
                    accel[0] -= forward[0] * speed;
                    accel[1] -= forward[1] * speed;
                    accel[2] -= forward[2] * speed;
                }
                if (this.keys['KeyA']) {
                    accel[0] -= right[0] * speed;
                    accel[2] -= right[2] * speed;
                }
                if (this.keys['KeyD']) {
                    accel[0] += right[0] * speed;
                    accel[2] += right[2] * speed;
                }
                if (this.keys['KeyE'] || this.keys['Space']) {
                    accel[1] += speed * 0.85;
                }
                if (this.keys['KeyQ']) {
                    accel[1] -= speed * 0.85;
                }

                this.vel[0] = this.vel[0] * 0.88 + accel[0] * dt;
                this.vel[1] = this.vel[1] * 0.88 + accel[1] * dt;
                this.vel[2] = this.vel[2] * 0.88 + accel[2] * dt;

                this.pos[0] += this.vel[0] * dt;
                this.pos[1] += this.vel[1] * dt;
                this.pos[2] += this.vel[2] * dt;
            }
        }

        getRotationMatrix() {
            if (this.mode === 'orbit') {
                const fx = this.target[0] - this.pos[0];
                const fy = this.target[1] - this.pos[1];
                const fz = this.target[2] - this.pos[2];
                const fLen = Math.hypot(fx, fy, fz);
                const forward = [fx / fLen, fy / fLen, fz / fLen];

                const rx = -forward[2];
                const rz = forward[0];
                const rLen = Math.hypot(rx, rz);
                const right = [rx / rLen, 0, rz / rLen];

                const up = [
                    right[1] * forward[2] - right[2] * forward[1],
                    right[2] * forward[0] - right[0] * forward[2],
                    right[0] * forward[1] - right[1] * forward[0]
                ];

                return [
                    right[0], right[1], right[2],
                    up[0], up[1], up[2],
                    -forward[0], -forward[1], -forward[2]
                ];
            } else {
                const cosY = Math.cos(this.yaw), sinY = Math.sin(this.yaw);
                const cosP = Math.cos(this.pitch), sinP = Math.sin(this.pitch);

                const fx = Math.sin(this.yaw) * cosP;
                const fy = Math.sin(this.pitch);
                const fz = -Math.cos(this.yaw) * cosP;

                const rx = Math.cos(this.yaw);
                const ry = 0;
                const rz = Math.sin(this.yaw);

                const ux = ry * fz - rz * fy;
                const uy = rz * fx - rx * fz;
                const uz = rx * fy - ry * fx;

                return [
                    rx, ry, rz,
                    ux, uy, uz,
                    -fx, -fy, -fz
                ];
            }
        }
    }

    /* ==========================================================================
       4. Dynamic Particle Swarm Simulation Engine
       ========================================================================== */
    class ParticleSwarm {
        constructor(count = SWARM_COUNT) {
            this.count = count;
            this.positions = new Float32Array(count * 3);
            this.velocities = new Float32Array(count * 3);
            this.lifetimes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                this.resetParticle(i, true);
            }
        }

        resetParticle(i, initial = false) {
            const theta = Math.random() * Math.PI * 2.0;
            const phi = (Math.random() - 0.5) * Math.PI;

            this.lifetimes[i] = initial ? Math.random() : 1.0;

            const behavior = (currentProfile && currentProfile.swarm) ? currentProfile.swarm.behavior : 'thermal_drift';
            const speedScale = (currentProfile && currentProfile.swarm) ? currentProfile.swarm.speed : 1.0;
            const center = explosionCenter;

            if (behavior === 'ballistic_cascade') {
                // Water / Liquid fountain: upward pressurized nozzle spray with initial droplet grouping
                const spreadAngle = 0.08 + Math.random() * 0.24;
                const speed = (4.5 + Math.random() * 3.2) * speedScale;
                this.positions[i * 3 + 0] = center[0] + (Math.random() - 0.5) * 0.18;
                this.positions[i * 3 + 1] = -0.35;
                this.positions[i * 3 + 2] = center[2] + (Math.random() - 0.5) * 0.18;

                this.velocities[i * 3 + 0] = Math.cos(theta) * Math.sin(spreadAngle) * speed;
                this.velocities[i * 3 + 1] = Math.cos(spreadAngle) * speed;
                this.velocities[i * 3 + 2] = Math.sin(theta) * Math.sin(spreadAngle) * speed;
            } else if (behavior === 'dust_sweep') {
                // Bagnold Aeolian Sand Model: 70% saltating surface grains, 30% suspended atmospheric motes
                const isSuspended = (Math.random() < 0.30);
                if (isSuspended) {
                    // Suspended fine dust motes: high altitude dispersion across air volume
                    this.positions[i * 3 + 0] = center[0] + (Math.random() - 0.5) * 6.8;
                    this.positions[i * 3 + 1] = center[1] + 0.4 + Math.random() * 3.2;
                    this.positions[i * 3 + 2] = center[2] + (Math.random() - 0.5) * 6.8;

                    this.velocities[i * 3 + 0] = (1.8 + Math.random() * 2.4) * speedScale;
                    this.velocities[i * 3 + 1] = (Math.random() - 0.52) * 0.25 * speedScale;
                    this.velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.8 * speedScale;
                } else {
                    // Saltating sand grains: initiated near ground by surface shear velocity
                    this.positions[i * 3 + 0] = center[0] - 2.8 + Math.random() * 1.5;
                    this.positions[i * 3 + 1] = -0.42 + Math.random() * 0.22;
                    this.positions[i * 3 + 2] = center[2] + (Math.random() - 0.5) * 3.5;

                    this.velocities[i * 3 + 0] = (2.2 + Math.random() * 2.8) * speedScale;
                    this.velocities[i * 3 + 1] = (0.7 + Math.random() * 1.4) * speedScale; // Low hop
                    this.velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.6 * speedScale;
                }
            } else if (behavior === 'rain_fall') {
                // Gunn-Kinzer Rain Model: high ceiling spawn with terminal downward velocity
                this.positions[i * 3 + 0] = center[0] + (Math.random() - 0.5) * 7.5;
                this.positions[i * 3 + 1] = center[1] + 4.2 + Math.random() * 3.5;
                this.positions[i * 3 + 2] = center[2] + (Math.random() - 0.5) * 7.5;

                this.velocities[i * 3 + 0] = (Math.random() - 0.5) * 0.3;
                this.velocities[i * 3 + 1] = -(12.0 + Math.random() * 5.0) * speedScale;
                this.velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
            } else if (behavior === 'spark_ricochet') {
                // Industrial welding sparks: violent workpiece ejection with high velocity
                this.positions[i * 3 + 0] = center[0] + (Math.random() - 0.5) * 0.12;
                this.positions[i * 3 + 1] = 0.08 + Math.random() * 0.20;
                this.positions[i * 3 + 2] = center[2] + (Math.random() - 0.5) * 0.12;

                const spread = (Math.random() - 0.5) * Math.PI * 0.9;
                const spd = (8.5 + Math.random() * 7.5) * speedScale;
                this.velocities[i * 3 + 0] = Math.cos(spread) * spd;
                this.velocities[i * 3 + 1] = (1.2 + Math.random() * 4.8) * speedScale;
                this.velocities[i * 3 + 2] = Math.sin(spread) * spd;
            } else if (behavior === 'helical_funnel') {
                // Cyclone / vortex: spirals inward into funnel eye
                const ringR = 0.35 + Math.random() * 1.8;
                this.positions[i * 3 + 0] = center[0] + Math.cos(theta) * ringR;
                this.positions[i * 3 + 1] = center[1] - 0.2 + Math.random() * 0.6;
                this.positions[i * 3 + 2] = center[2] + Math.sin(theta) * ringR;

                this.velocities[i * 3 + 0] = -Math.sin(theta) * 2.8 * speedScale;
                this.velocities[i * 3 + 1] = (1.8 + Math.random() * 2.5) * speedScale;
                this.velocities[i * 3 + 2] = Math.cos(theta) * 2.8 * speedScale;
            } else if (behavior === 'keplerian_disk') {
                // Keplerian accretion disk in orbital plane
                const diskR = 0.5 + Math.random() * 3.2;
                this.positions[i * 3 + 0] = center[0] + Math.cos(theta) * diskR;
                this.positions[i * 3 + 1] = center[1] + (Math.random() - 0.5) * 0.22;
                this.positions[i * 3 + 2] = center[2] + Math.sin(theta) * diskR;

                const orbSpeed = Math.sqrt(2.0 / diskR) * 1.6 * speedScale;
                this.velocities[i * 3 + 0] = -Math.sin(theta) * orbSpeed;
                this.velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.08;
                this.velocities[i * 3 + 2] = Math.cos(theta) * orbSpeed;
            } else if (behavior === 'radial_ejecta') {
                // Supernova: 3D omnidirectional explosion
                const speed = (3.5 + Math.random() * 4.8) * speedScale;
                this.positions[i * 3 + 0] = center[0] + Math.cos(theta) * Math.cos(phi) * 0.22;
                this.positions[i * 3 + 1] = center[1] + Math.sin(phi) * 0.22;
                this.positions[i * 3 + 2] = center[2] + Math.sin(theta) * Math.cos(phi) * 0.22;

                this.velocities[i * 3 + 0] = Math.cos(theta) * Math.cos(phi) * speed;
                this.velocities[i * 3 + 1] = Math.sin(phi) * speed;
                this.velocities[i * 3 + 2] = Math.sin(theta) * Math.cos(phi) * speed;
            } else if (behavior === 'turbulent_gale') {
                // Blizzard: sweeping gale wind
                this.positions[i * 3 + 0] = center[0] - 3.8 + Math.random() * 0.6;
                this.positions[i * 3 + 1] = center[1] + Math.random() * 3.8;
                this.positions[i * 3 + 2] = center[2] + (Math.random() - 0.5) * 3.8;

                this.velocities[i * 3 + 0] = (3.4 + Math.random() * 2.2) * speedScale;
                this.velocities[i * 3 + 1] = -0.4 + (Math.random() - 0.5) * 0.8;
                this.velocities[i * 3 + 2] = (Math.random() - 0.5) * 1.4;
            } else {
                // Thermal drift: campfire smoke & embers rising in buoyant chimney
                const baseR = Math.random() * 0.55;
                this.positions[i * 3 + 0] = center[0] + Math.cos(theta) * baseR;
                this.positions[i * 3 + 1] = center[1] - 0.2 + Math.random() * 0.4;
                this.positions[i * 3 + 2] = center[2] + Math.sin(theta) * baseR;

                this.velocities[i * 3 + 0] = (Math.random() - 0.5) * 0.6;
                this.velocities[i * 3 + 1] = (1.2 + Math.random() * 1.8) * speedScale;
                this.velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.6;
            }
        }

        update(dt) {
            const swarm = (currentProfile && currentProfile.swarm) || DEFAULT_FIRE_SIMULATION_PROFILE.swarm;
            const gravity = swarm.gravity;
            const behavior = swarm.behavior;
            const floorY = -0.45;

            const dynamics = (currentProfile && currentProfile.dynamics) || DEFAULT_FIRE_SIMULATION_PROFILE.dynamics;
            const wind = dynamics.windVelocity || [0.4, 0.1, 0.1];
            const mass = dynamics.substanceMass || 0.30;
            const coupling = Math.min(18.0, 1.45 / Math.max(0.04, mass));

            for (let i = 0; i < this.count; i++) {
                this.lifetimes[i] -= dt * swarm.fadeRate;

                // Differential aerodynamic drag: particles relax towards ambient wind velocity based on substance inertia
                const dragAx = (wind[0] - this.velocities[i * 3 + 0]) * coupling;
                const dragAy = (wind[1] - this.velocities[i * 3 + 1]) * coupling * 0.35;
                const dragAz = (wind[2] - this.velocities[i * 3 + 2]) * coupling;

                // Thermal buoyancy for steam and smoke plumes (Boussinesq approximation)
                let extraAccelY = 0.0;
                if (currentProfile.topology === 'steam') {
                    extraAccelY = +2.4 * Math.max(0.0, this.lifetimes[i]);
                } else if (behavior === 'thermal_drift') {
                    extraAccelY = +0.6 * Math.max(0.0, this.lifetimes[i]);
                }

                this.velocities[i * 3 + 0] += dragAx * dt;
                this.velocities[i * 3 + 1] += (gravity + dragAy + extraAccelY) * dt;
                this.velocities[i * 3 + 2] += dragAz * dt;

                // Terminal velocity drag clamp for rain
                if (behavior === 'rain_fall') {
                    this.velocities[i * 3 + 1] = Math.max(-18.0, this.velocities[i * 3 + 1]);
                }

                // Mid-air explosive carbon starburst pop for welding sparks
                if (behavior === 'spark_ricochet') {
                    if (this.lifetimes[i] > 0.48 && this.lifetimes[i] < 0.52 && (i % 4 === 0)) {
                        this.velocities[i * 3 + 0] += (Math.random() - 0.5) * 4.5;
                        this.velocities[i * 3 + 1] += Math.random() * 3.5;
                        this.velocities[i * 3 + 2] += (Math.random() - 0.5) * 4.5;
                    }
                }

                this.positions[i * 3 + 0] += this.velocities[i * 3 + 0] * dt;
                this.positions[i * 3 + 1] += this.velocities[i * 3 + 1] * dt;
                this.positions[i * 3 + 2] += this.velocities[i * 3 + 2] * dt;

                // --- Ground Collision & Splash Physics ---
                if (this.positions[i * 3 + 1] < floorY) {
                    this.positions[i * 3 + 1] = floorY;

                    if (behavior === 'ballistic_cascade') {
                        // Water SPH Breakup: impacting drops atomize into upward splash crown
                        if (Math.abs(this.velocities[i * 3 + 1]) > 1.8) {
                            const dx = this.positions[i * 3 + 0] - explosionCenter[0];
                            const dz = this.positions[i * 3 + 2] - explosionCenter[2];
                            const len = Math.hypot(dx, dz) || 1.0;
                            const splashSpd = 2.0 + Math.random() * 2.4;

                            this.velocities[i * 3 + 0] = (dx / len) * splashSpd + (Math.random() - 0.5) * 0.8;
                            this.velocities[i * 3 + 1] = 0.9 + Math.random() * 1.8; // Upward splash
                            this.velocities[i * 3 + 2] = (dz / len) * splashSpd + (Math.random() - 0.5) * 0.8;
                            this.lifetimes[i] = 0.22; // Quick atomization fade
                        } else {
                            this.velocities[i * 3 + 1] = 0.0;
                            this.velocities[i * 3 + 0] *= 0.65;
                            this.velocities[i * 3 + 2] *= 0.65;
                        }
                    } else if (behavior === 'spark_ricochet') {
                        // Inelastic Newton collision with high restitution and friction
                        this.velocities[i * 3 + 1] = -this.velocities[i * 3 + 1] * 0.72;
                        this.velocities[i * 3 + 0] *= 0.80;
                        this.velocities[i * 3 + 2] *= 0.80;
                    } else if (behavior === 'dust_sweep') {
                        // Bagnold reptation / surface creep: low bounce, slides along wind
                        this.velocities[i * 3 + 1] = 0.12 + Math.random() * 0.28;
                        this.velocities[i * 3 + 0] = wind[0] * 0.35 + (Math.random() - 0.5) * 0.4;
                        this.velocities[i * 3 + 2] = wind[2] * 0.35 + (Math.random() - 0.5) * 0.4;
                    } else if (behavior === 'rain_fall') {
                        // Instantaneous pavement micro-splatter burst
                        this.velocities[i * 3 + 1] = 0.8 + Math.random() * 1.4;
                        const angle = Math.random() * Math.PI * 2.0;
                        this.velocities[i * 3 + 0] = Math.cos(angle) * (1.6 + Math.random() * 1.8);
                        this.velocities[i * 3 + 2] = Math.sin(angle) * (1.6 + Math.random() * 1.8);
                        this.lifetimes[i] = 0.06; // Flash splash disappears
                    }
                }

                const killFloor = (behavior === 'ballistic_cascade' || behavior === 'spark_ricochet' || behavior === 'dust_sweep') ? (floorY - 0.08) : (floorY - 0.5);
                if (this.lifetimes[i] <= 0.0 || this.positions[i * 3 + 1] < killFloor) {
                    this.resetParticle(i);
                }
            }
        }
    }

    const swarm = new ParticleSwarm(SWARM_COUNT);
    const camera = new CameraController();

    window.currentProfile = currentProfile;
    window.targetProfile = targetProfile;
    window.morphToSimulation = morphToSimulation;
    window.swarm = swarm;
    window.camera = camera;
    const crosshair = document.getElementById('crosshair');

    function toggleCameraMode() {
        if (camera.mode === 'orbit') {
            camera.mode = 'flight';
            camera.yaw = -camera.theta - Math.PI;
            camera.pitch = (Math.PI * 0.5) - camera.phi;
            crosshair.classList.add('active');
        } else {
            camera.mode = 'orbit';
            crosshair.classList.remove('active');
        }
    }

    document.getElementById('btn-blast').addEventListener('click', () => {
        triggerBlast();
    });

    const promptInput = document.getElementById('prompt-input');
    const btnMorph = document.getElementById('btn-morph');
    const btnMorphText = document.getElementById('btn-morph-text');
    const promptForm = document.getElementById('prompt-form');

    function handleMorphSubmit() {
        const val = promptInput ? promptInput.value.trim() : '';
        if (!val) return;
        morphToSimulation(val);
        if (btnMorphText) {
            btnMorphText.textContent = 'Morphed!';
            setTimeout(() => {
                if (btnMorphText) btnMorphText.textContent = 'Morph';
            }, 1200);
        }
    }

    if (promptForm) {
        promptForm.addEventListener('submit', (e) => {
            e.preventDefault();
            e.stopPropagation();
            handleMorphSubmit();
        });
    }

    if (btnMorph) {
        btnMorph.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            handleMorphSubmit();
        });
    }

    if (promptInput) {
        promptInput.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Enter') {
                e.preventDefault();
                handleMorphSubmit();
            }
        });
        promptInput.addEventListener('keyup', (e) => {
            e.stopPropagation();
        });
        promptInput.addEventListener('keypress', (e) => {
            e.stopPropagation();
        });
    }

    document.querySelectorAll('.prompt-chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const prompt = chip.getAttribute('data-prompt');
            if (promptInput) promptInput.value = prompt;
            morphToSimulation(prompt);
        });
    });

    function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const maxDim = 1280;
        const scale = Math.min(1.0, maxDim / Math.max(w, h));
        const targetW = Math.max(320, Math.floor(w * scale));
        const targetH = Math.max(240, Math.floor(h * scale));
        if (canvas.width !== targetW || canvas.height !== targetH) {
            canvas.width = targetW;
            canvas.height = targetH;
            initFbo(canvas.width, canvas.height);
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
    }
    window.addEventListener('resize', resize);
    resize();

    let frameCount = 0;
    let lastFpsUpdate = performance.now();
    const fpsLabel = document.getElementById('fps-label');
    const proximityLabel = document.getElementById('proximity-label');
    const proximityDot = document.getElementById('proximity-dot');
    const coreGlare = document.getElementById('core-glare');

    let lastTime = performance.now();

    function render(currentTime) {
        const dt = Math.min(0.1, (currentTime - lastTime) * 0.001);
        lastTime = currentTime;

        blastTime += dt;

        camera.update(dt);

        if (morphProgress < 1.0) {
            morphProgress = Math.min(1.0, morphProgress + dt / morphDuration);
            const smoothAlpha = morphProgress * morphProgress * (3.0 - 2.0 * morphProgress);
            currentProfile = interpolateSimulationProfiles(morphStartProfile, targetProfile, smoothAlpha);
            window.currentProfile = currentProfile;
        }

        const scale = currentProfile.morphology.scale * explosionScale;
        const coreRadius = 2.4 * scale;

        const dx = camera.pos[0] - explosionCenter[0];
        const dy = camera.pos[1] - explosionCenter[1];
        const dz = camera.pos[2] - explosionCenter[2];
        const distToCenter = Math.hypot(dx, dy, dz);
        const isInsideCore = distToCenter < coreRadius;

        if (isInsideCore && currentProfile.emissionModel === 0) {
            const heatRatio = 1.0 - (distToCenter / coreRadius);
            coreGlare.style.opacity = (heatRatio * 0.95).toFixed(2);
            proximityLabel.textContent = `INSIDE ${currentProfile.name.toUpperCase()} (${distToCenter.toFixed(1)}m)`;
            proximityDot.className = 'indicator core';
        } else {
            coreGlare.style.opacity = '0';
            proximityLabel.textContent = `Distance: ${distToCenter.toFixed(1)}m`;
            proximityDot.className = 'indicator';
        }

        // Pass 1: Continuous Volumetric Fluid Raymarching to Offscreen FBO
        gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
        gl.viewport(0, 0, canvas.width, canvas.height);

        gl.useProgram(program);
        gl.uniform2f(uResLoc, canvas.width, canvas.height);
        gl.uniform1f(uTimeLoc, currentTime * 0.001);
        gl.uniform1f(uBlastTimeLoc, blastTime);
        gl.uniform3f(uCamPosLoc, camera.pos[0], camera.pos[1], camera.pos[2]);

        const rotMat = camera.getRotationMatrix();
        gl.uniformMatrix3fv(uCamRotLoc, false, new Float32Array(rotMat));

        gl.uniform1f(uFovLoc, camera.fov);
        gl.uniform3f(uCenterLoc, explosionCenter[0], explosionCenter[1], explosionCenter[2]);
        gl.uniform1f(uScaleLoc, scale);

        // Dynamic Simulation Uniforms
        gl.uniform3fv(uPaletteCoreLoc, currentProfile.palette.core);
        gl.uniform3fv(uPaletteMidLoc, currentProfile.palette.mid);
        gl.uniform3fv(uPaletteOuterLoc, currentProfile.palette.outer);
        gl.uniform1f(uSwirlVorticityLoc, currentProfile.dynamics.swirlVorticity);
        gl.uniform1f(uUpwardDraftLoc, currentProfile.dynamics.upwardDraft);
        gl.uniform1f(uRadialExpansionLoc, currentProfile.dynamics.radialExpansion);
        gl.uniform1f(uGravityBuoyancyLoc, currentProfile.dynamics.gravityBuoyancy);
        gl.uniform1f(uAbsorptionCoeffLoc, currentProfile.morphology.absorptionCoeff);

        const { w: topWeights, w2: topWeights2 } = getTopologyWeights(
            morphStartProfile.topology || 'plume',
            targetProfile.topology || 'plume',
            morphProgress
        );
        gl.uniform4fv(uTopologyWeightsLoc, topWeights);
        gl.uniform2fv(uTopologyWeights2Loc, topWeights2);

        gl.uniform3fv(uWindVelocityLoc, currentProfile.dynamics.windVelocity || [0.4, 0.1, 0.1]);
        gl.uniform1f(uSubstanceMassLoc, currentProfile.dynamics.substanceMass || 0.30);
        gl.uniform1f(uKinematicGravityLoc, currentProfile.swarm ? currentProfile.swarm.gravity : -1.2);
        gl.uniform1i(uEmissionModelLoc, typeof currentProfile.emissionModel === 'number' ? currentProfile.emissionModel : 0);

        gl.bindVertexArray(quadVao);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        // Sub-pass 1B: GPU Particle Swarm additive overlay onto sceneFbo
        swarm.update(dt);
        gl.useProgram(swarmProgram);
        gl.uniformMatrix3fv(swarmCamRotLoc, false, new Float32Array(rotMat));
        gl.uniform3f(swarmCamPosLoc, camera.pos[0], camera.pos[1], camera.pos[2]);
        gl.uniform1f(swarmFovLoc, camera.fov);
        gl.uniform2f(swarmResLoc, canvas.width, canvas.height);
        gl.uniform1f(swarmParticleSizeLoc, currentProfile.swarm ? currentProfile.swarm.particleSize : 3.5);
        gl.uniform1f(swarmTimeLoc, currentTime * 0.001);
        gl.uniform3fv(swarmPaletteCoreLoc, currentProfile.palette.core);
        gl.uniform3fv(swarmPaletteMidLoc, currentProfile.palette.mid);
        const shapeId = SHAPE_MAP[currentProfile.swarm ? currentProfile.swarm.shape : 'spark'] || 0;
        gl.uniform1i(swarmParticleShapeLoc, shapeId);
        gl.uniform1f(swarmParticleGlowLoc, currentProfile.swarm ? currentProfile.swarm.particleGlow : 1.2);

        gl.bindBuffer(gl.ARRAY_BUFFER, swarmPosVbo);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, swarm.positions);

        gl.bindBuffer(gl.ARRAY_BUFFER, swarmVelVbo);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, swarm.velocities);

        gl.bindBuffer(gl.ARRAY_BUFFER, swarmLifeVbo);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, swarm.lifetimes);

        gl.enable(gl.BLEND);
        if (shapeId === 4) {
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); // Diffuse non-emissive dust scattering
        } else {
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // Additive luminous incandescence / water transmission
        }

        gl.bindVertexArray(swarmVao);
        const drawCount = currentProfile.swarm ? Math.min(SWARM_COUNT, currentProfile.swarm.particleCount || SWARM_COUNT) : SWARM_COUNT;
        gl.drawArrays(gl.POINTS, 0, drawCount);

        gl.disable(gl.BLEND);
        gl.bindVertexArray(null);

        // Pass 2: Post-Process Lens Blur, Soft Bloom & Optical Heat Shimmer to Screen
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);

        gl.useProgram(blurProgram);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, sceneTex);
        gl.uniform1i(blurSceneTexLoc, 0);
        gl.uniform2f(blurResLoc, canvas.width, canvas.height);
        gl.uniform1f(blurAmountLoc, (currentProfile.emissionModel === 2) ? 0.35 : currentProfile.optics.blurAmount);
        gl.uniform1f(blurTimeLoc, currentTime * 0.001);
        gl.uniform3f(blurCamPosLoc, camera.pos[0], camera.pos[1], camera.pos[2]);
        gl.uniformMatrix3fv(blurCamRotLoc, false, new Float32Array(rotMat));
        gl.uniform1f(blurFovLoc, camera.fov);
        gl.uniform3f(blurCenterLoc, explosionCenter[0], explosionCenter[1], explosionCenter[2]);
        gl.uniform1f(blurShimmerLoc, (currentProfile.emissionModel === 2) ? 0.0 : currentProfile.optics.shimmerAmount);

        gl.bindVertexArray(quadVao);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        frameCount++;
        if (currentTime - lastFpsUpdate >= 1000) {
            fpsLabel.textContent = `${frameCount} FPS`;
            frameCount = 0;
            lastFpsUpdate = currentTime;
        }

        requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
    </script>
</body>
</html>
