<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratchbox IDE — Spatial & Generative Studio Demos</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.16);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --badge-bg: rgba(56, 189, 248, 0.12);
      --badge-text: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      padding: 40px 24px;
      line-height: 1.5;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 36px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 28px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .version-pill {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 10px;
      border-radius: 9999px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 720px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 24px;
    }
    .search-input {
      background: #18181b;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      width: 320px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .filter-btn {
      background: #18181b;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .filter-btn.active {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--card-hover);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--badge-bg);
      color: var(--badge-text);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .card-desc {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 18px;
      flex-grow: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
    }
    .launch-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #27272a;
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.15s;
    }
    .launch-btn:hover {
      background: var(--accent);
      color: #09090b;
    }
    .asset-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #34d399;
      font-weight: 500;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>
          Scratchbox Studio Demos
          <span class="version-pill">Self-Hydrating · Tier-1 Native</span>
        </h1>
      </div>
      <p class="subtitle">
        Architectural catalog of real-time 3D Gaussian Splatting, procedural C++20 botanical synthesis, WebGPU Nanite path tracing, VFX matchmoving, and UTDRA geodetic environments.
      </p>
      <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Search demos by name or tech...">
        <button class="filter-btn active" data-filter="all">All Showcase (31)</button>
        <button class="filter-btn" data-filter="3dgs">3DGS Radiance Fields</button>
        <button class="filter-btn" data-filter="botanical">Botanical & Trees</button>
        <button class="filter-btn" data-filter="vfx">VFX & Matchmoving</button>
        <button class="filter-btn" data-filter="arch">Architecture & Metrology</button>
        <button class="filter-btn" data-filter="webgpu">WebGPU & Graphics</button>
      </div>
    </header>

    <div class="grid" id="demosGrid"></div>
  </div>

  <script>

      },

      },

      },
      {
        title: "Camera Choreography Studio",
        path: "showcase/camera_choreography_studio.html",

        desc: "Histogram matching, 3D LUT generation, and color temperature calibration between live 3D plates and reference video."
      },
      {
        title: "Adaptive World Styling Visualizer",
        path: "showcase/adaptive_world_styling_visualizer.html",
        badge: "WORLD STYLING",
        category: "arch",
        desc: "Continuous physical parameter styling with zero closed taxonomies, procedural material shaders, and architectural overlays."
      },
      {
        title: "The Plaza Hotel Eloise Sequence",
        path: "showcase/plaza_matchmove_eloise.html",
        badge: "VFX PRODUCTION",
        category: "vfx",
        desc: "Extended camera matchmove sequence demonstrating stable occlusion, background building alignment, and sub-pixel edge lock."
      },
      {
        title: "Video Branching Studio",
        path: "showcase/video_branching_studio.html",
        badge: "NON-LINEAR NLE",
        category: "vfx",
        desc: "Non-linear multi-branch narrative video timeline synthesis with interactive nodal decision points."
      },
      {
        title: "GeoBox Geolocation Model Evaluation",
        path: "showcase/geobox_eval_report.html",
        badge: "SIGLIP-2 AI",
        category: "arch",
        desc: "Metrological evaluation report measuring spatial localization precision across geodetic landmarks."
      },
      {
        title: "GeoBox Precision Metrology Report",
        path: "showcase/geobox_precision_report.html",
        badge: "METROLOGY",
        category: "arch",
        desc: "Comprehensive numerical verification report auditing sub-pixel reprojection RMS and GPS standoff coordinates."
      },
      {
        title: "Visual Proof Alignment Suite",
        path: "showcase/visual_proof_alignment.html",
        badge: "VISUAL PROOF",
        category: "arch",
        desc: "Split-view geometric overlay and edge difference verification demonstrating 0.000 px spatial alignment."
      },
      {
        title: "Agent 3D Scene Lighting Intelligence",
        path: "showcase/agent_lighting_proof.html",
        badge: "GAFFER INTEL",
        category: "webgpu",
        desc: "Autonomous diurnal solar ephemeris positioning, physical key/fill/rim balance, and spherical harmonic ambient probe evaluation."
      },
      {
        title: "Camera Space Studio & Sensor Suite",
        path: "showcase/camera_space_visualizer.html",
        badge: "SENSOR SUITE",
        category: "vfx",
        desc: "Interactive 6-DOF camera space visualization, pinhole optics calibration, sensor plane frustum, and geodetic orientation suite."
      }
    ];

    const grid = document.getElementById('demosGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function render(filter = 'all', query = '') {
      grid.innerHTML = '';
      const q = query.toLowerCase().trim();
      const filtered = DEMOS.filter(d => {
        const matchesCategory = filter === 'all' || d.category === filter;
        const matchesQuery = !q || d.title.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || d.badge.toLowerCase().includes(q);
        return matchesCategory && matchesQuery;
      });

      filtered.forEach(d => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <a href="${d.path}" class="card-title">${d.title}</a>
              <span class="badge">${d.badge}</span>
            </div>
            <p class="card-desc">${d.desc}</p>
          </div>
          <div class="card-footer">
            <span class="asset-status">
              <span class="dot"></span>
              Assets Hydrated
            </span>
            <a href="${d.path}" class="launch-btn">Launch Studio &rarr;</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => {
      const activeBtn = document.querySelector('.filter-btn.active');
      render(activeBtn ? activeBtn.dataset.filter : 'all', e.target.value);
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.dataset.filter, searchInput.value);
      });
    });

    render();
  </script>
</body>
</html>
