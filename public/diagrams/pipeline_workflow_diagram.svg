    <text x="60" y="48" fill="#f1f5f9" font-size="14" font-weight="700">Headless Viewport Capture</text>
    
    <path d="M 16 64 H 274" stroke="#334155" stroke-width="1" />
    
    <text x="16" y="86" fill="#94a3b8" font-size="11">● Capture Mode: <tspan fill="#e2e8f0">Puppeteer Canvas Grab</tspan></text>
    <text x="16" y="106" fill="#94a3b8" font-size="11">● Synchronization: <tspan fill="#e2e8f0">Explicit Frame Settle</tspan></text>
    <text x="16" y="126" fill="#94a3b8" font-size="11">● FFmpeg Encoder: <tspan fill="#e2e8f0">H.264 High Profile</tspan></text>
    <text x="32" y="144" fill="#64748b" font-size="10.5">1280 &times; 720, 24fps, yuv420p</text>
    
    <rect x="16" y="162" width="258" height="52" rx="6" fill="#451a03" stroke="#d97706" stroke-width="1" />
    <text x="26" y="182" fill="#fde68a" font-size="10.5" font-weight="700">Generated Conditioning Tokens:</text>
    <text x="26" y="198" fill="#f59e0b" font-size="10">📸 &lt;IMAGE_REF_0&gt; (Frame 00 Start Pose)</text>
    <text x="26" y="210" fill="#f59e0b" font-size="10">🎥 &lt;VIDEO_REF_0&gt; (3.0s Blockout Camera)</text>
  </g>

