  <g transform="translate(35, 85)">
    <rect width="310" height="230" rx="12" fill="url(#cardGrad1)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#0369a1" fill-opacity="0.4" />
    <text x="25" y="38" font-size="18">🌐</text>
    <text x="60" y="32" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">PHASE 1: INGESTION</text>
    <text x="60" y="48" fill="#f1f5f9" font-size="14" font-weight="700">Google 3D Tiles Streamer</text>
    
    <path d="M 16 64 H 294" stroke="#334155" stroke-width="1" />
    
    <text x="16" y="86" fill="#94a3b8" font-size="11">● Geographic Datum: <tspan fill="#e2e8f0" font-weight="600">Midtown Manhattan</tspan></text>
    <text x="16" y="106" fill="#94a3b8" font-size="11">● Level of Detail: <tspan fill="#38bdf8" font-weight="600">Deepest Leaf LOD</tspan> (errorTarget &le; 0.5)</text>
    <text x="16" y="126" fill="#94a3b8" font-size="11">● SSE Calculation: <tspan fill="#e2e8f0">4K Viewport (3840 &times; 2160)</tspan></text>
    <text x="16" y="146" fill="#94a3b8" font-size="11">● Asynchronous Octree Settling:</text>
    <text x="32" y="164" fill="#64748b" font-size="10.5">downloading === 0 &amp;&amp; parsing === 0</text>
    
    <rect x="16" y="180" width="278" height="34" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
    <text x="26" y="201" fill="#7dd3fc" font-size="10.5" font-weight="600">✓ Multi-Waypoint Pre-Warming: [0, 18, 36, 54, 71]</text>
  </g>

  <!-- Connector: 1 -> 2 -->
  <path d="M 345 200 H 380" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />
  <rect x="348" y="180" width="30" height="16" rx="4" fill="#0f172a" />
  <text x="350" y="192" fill="#38bdf8" font-size="9" font-weight="600">GLTF</text>

  <!-- Card 2: 3D Engine & Trajectory -->
  <g transform="translate(385, 85)">
    <rect width="310" height="230" rx="12" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#6d28d9" fill-opacity="0.4" />
    <text x="25" y="38" font-size="18">📐</text>
    <text x="60" y="32" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="1">PHASE 2: 3D ENGINE</text>
    <text x="60" y="48" fill="#f1f5f9" font-size="14" font-weight="700">Three.js &amp; Clay Flight System</text>
    
    <path d="M 16 64 H 294" stroke="#334155" stroke-width="1" />
    
    <text x="16" y="86" fill="#94a3b8" font-size="11">● Material Override: <tspan fill="#e2e8f0" font-weight="600">Architectural Clay PBR</tspan></text>
    <text x="32" y="104" fill="#64748b" font-size="10.5">Hex #dcd6cd, Roughness 0.82, Metalness 0.02</text>
    <text x="16" y="124" fill="#94a3b8" font-size="11">● Trajectory Spline: <tspan fill="#e2e8f0">72 frames @ 24fps (3.0s)</tspan></text>
    <text x="16" y="144" fill="#94a3b8" font-size="11">● Collision Pre-Check: <tspan fill="#c084fc" font-weight="600">minClearance &ge; 12.0m</tspan></text>
    
    <rect x="16" y="168" width="278" height="46" rx="6" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
    <text x="26" y="188" fill="#d8b4fe" font-size="10.5" font-weight="600">🛡️ Parabolic Altitude Arch: +17.8m clearance</text>
    <text x="26" y="204" fill="#a855f7" font-size="9.5">Eliminates rooftop clipping; Frame 0 locked at 95.0m</text>
  </g>

  <!-- Connector: 2 -> 3 -->
  <path d="M 695 200 H 730" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPurple)" />
  <rect x="698" y="180" width="30" height="16" rx="4" fill="#0f172a" />
  <text x="702" y="192" fill="#c084fc" font-size="9" font-weight="600">Pose</text>

