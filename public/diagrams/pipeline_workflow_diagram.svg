  <path d="M 880 315 V 345 H 540 V 360" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowAmber)" />
  <rect x="670" y="337" width="90" height="16" rx="4" fill="#0f172a" />
  <text x="675" y="349" fill="#fbbf24" font-size="9" font-weight="600">Dual-Conditioning</text>

