  <!-- Card 6: Architectural Principles (Bottom Left) -->
  <g transform="translate(35, 365)">
    <rect width="310" height="230" rx="12" fill="url(#cardGrad1)" stroke="#475569" stroke-width="1.5" />
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#334155" fill-opacity="0.4" />
    <text x="25" y="38" font-size="18">🛡️</text>
    <text x="60" y="32" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">SYSTEM CONSTRAINTS</text>
    <text x="60" y="48" fill="#f1f5f9" font-size="14" font-weight="700">Engineering Guardrails</text>
    
    <path d="M 16 64 H 294" stroke="#334155" stroke-width="1" />
    
    <text x="16" y="86" fill="#e2e8f0" font-size="11" font-weight="600">1. Zero Primitive Box Regressions</text>
    <text x="32" y="102" fill="#94a3b8" font-size="10">Strict Google 3D Tiles; no analytical cubes</text>
    
    <text x="16" y="122" fill="#e2e8f0" font-size="11" font-weight="600">2. Strict Continuous Shot (No Cuts)</text>
    <text x="32" y="138" fill="#94a3b8" font-size="10">Omni prompted for single take; no edits</text>
    
    <text x="16" y="158" fill="#e2e8f0" font-size="11" font-weight="600">3. Trajectory-Wide Collision Auditing</text>
    <text x="32" y="174" fill="#94a3b8" font-size="10">Multi-waypoint raycast sweep &ge; 12.0m</text>

    <text x="16" y="194" fill="#e2e8f0" font-size="11" font-weight="600">4. Exact 3.0s Timing Synchronization</text>
    <text x="32" y="210" fill="#94a3b8" font-size="10">Omni preset duration matches blockout 1:1</text>
  </g>

  <!-- Card 4: Vertex AI Omni 1.1 (Center Bottom) -->
  <g transform="translate(385, 365)">
    <rect width="310" height="230" rx="12" fill="url(#cardGrad1)" stroke="#f43f5e" stroke-width="1.5" />
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#9f1239" fill-opacity="0.4" />
    <text x="25" y="38" font-size="18">🧠</text>
    <text x="60" y="32" fill="#fb7185" font-size="11" font-weight="700" letter-spacing="1">PHASE 4: NEURAL SYNTHESIS</text>
    <text x="60" y="48" fill="#f1f5f9" font-size="14" font-weight="700">Vertex AI Omni 1.1 Flash</text>
    
    <path d="M 16 64 H 294" stroke="#334155" stroke-width="1" />
    
    <text x="16" y="86" fill="#94a3b8" font-size="11">● Foundation Model: <tspan fill="#f1f5f9" font-weight="600">gemini-omni-1.1-flash-preview</tspan></text>
    <text x="16" y="106" fill="#94a3b8" font-size="11">● Dual Conditioning: <tspan fill="#fda4af" font-weight="600">&lt;IMAGE_REF_0&gt; + &lt;VIDEO_REF_0&gt;</tspan></text>
    <text x="16" y="126" fill="#94a3b8" font-size="11">● Output Resolution: <tspan fill="#e2e8f0">1280 &times; 720 @ 24fps (3.01s)</tspan></text>
    <text x="16" y="146" fill="#94a3b8" font-size="11">● Prompt Directive: <tspan fill="#fb7185" font-weight="600">Strict single-take flyover</tspan></text>
    <text x="32" y="164" fill="#64748b" font-size="10.5">Golden hour sun, glass reflections, 5th Ave traffic</text>

    <rect x="16" y="176" width="278" height="38" rx="6" fill="#4c0519" stroke="#e11d48" stroke-width="1" />
    <text x="26" y="196" fill="#fecdd3" font-size="10.5" font-weight="600">✓ Output: google_tiles_omni_real_neural.mp4</text>
    <text x="26" y="208" fill="#fda4af" font-size="9.5">Photorealistic neural video with zero scene cuts</text>
  </g>

  <!-- Connector: 4 -> 5 -->
  <path d="M 695 480 H 730" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowEmerald)" />
  <rect x="698" y="460" width="30" height="16" rx="4" fill="#0f172a" />
  <text x="702" y="472" fill="#10b981" font-size="9" font-weight="600">Verify</text>

  <!-- Card 5: Split-Screen & Gallery (Bottom Right) -->
  <g transform="translate(735, 365)">
    <rect width="290" height="230" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" />
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#065f46" fill-opacity="0.4" />
    <text x="25" y="38" font-size="18">📊</text>
    <text x="60" y="32" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1">PHASE 5: QA &amp; PREVIEW</text>
    <text x="60" y="48" fill="#f1f5f9" font-size="14" font-weight="700">Verification &amp; Gallery</text>
    
    <path d="M 16 64 H 274" stroke="#334155" stroke-width="1" />
    
    <text x="16" y="86" fill="#94a3b8" font-size="11">● Split-Screen Pipeline: <tspan fill="#e2e8f0">FFmpeg hstack</tspan></text>
    <text x="32" y="104" fill="#64748b" font-size="10.5">google_tiles_clay_vs_omni_real_comparison.mp4</text>
    
    <text x="16" y="124" fill="#94a3b8" font-size="11">● Multimodal Quality Checks:</text>
    <text x="32" y="142" fill="#6ee7b7" font-size="10.5">Keyframes at t=0.5s, 1.5s, 2.8s inspected</text>
    <text x="32" y="158" fill="#6ee7b7" font-size="10.5">Rooftop clearance &amp; timing lock confirmed</text>

    <rect x="16" y="174" width="258" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="26" y="194" fill="#a7f3d0" font-size="10.5" font-weight="600">🌐 public/s4d_multi_gallery.html</text>
    <text x="26" y="208" fill="#6ee7b7" font-size="9.5">Interactive 3D / 4D inspection workspace</text>
