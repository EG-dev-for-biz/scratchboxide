  <text x="35" y="60" fill="#94a3b8" font-size="12">End-to-End Workflow Architecture: Photorealistic Geospatial Ingestion, 3D Blockout &amp; Dual-Conditioned Neural Synthesis</text>

  <!-- Status Badges in Top Right -->
  <rect x="740" y="24" width="135" height="24" rx="12" fill="#1e293b" stroke="#334155" />
  <circle cx="752" cy="36" r="4" fill="#10b981" />
  <text x="764" y="40" fill="#cbd5e1" font-size="11" font-weight="600">Timing Locked (3.0s)</text>

  <rect x="885" y="24" width="140" height="24" rx="12" fill="#1e293b" stroke="#334155" />
  <circle cx="897" cy="36" r="4" fill="#38bdf8" />
  <text x="909" y="40" fill="#cbd5e1" font-size="11" font-weight="600">Zero Cuts / Single Take</text>

