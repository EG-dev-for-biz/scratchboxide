<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        html,
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: none;
        }

        .theia-preload::after {
            content: none;
        }

        .spinner-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .custom-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-spinner svg {
            width: 110px;
            height: 110px;
            animation-duration: 2.2s;
            animation-iteration-count: infinite;
            animation-name: scratchbox-spinner;
            animation-timing-function: ease-in-out;
        }

        @keyframes scratchbox-spinner {
            0% {
                transform: scale(0.92);
                opacity: 0.8;
                filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4));
            }

            50% {
                transform: scale(1.06);
                opacity: 1;
                filter: drop-shadow(0 0 24px rgba(96, 165, 250, 0.8));
            }

            100% {
                transform: scale(0.92);
                opacity: 0.8;
                filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4));
            }
        }
    </style>
</head>

<body>
    <div class='spinner-container'>
        <div class='custom-spinner'>
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="spinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#1d4ed8" />
                    </linearGradient>
                </defs>
                <rect x="8" y="8" width="84" height="84" rx="20" fill="url(#spinGrad)" />
                <path d="M 37 32 L 25 50 L 37 68" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M 63 32 L 75 50 L 63 68" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                <line x1="55" y1="28" x2="45" y2="72" stroke="#bfdbfe" stroke-width="5.5" stroke-linecap="round" />
            </svg>
        </div>
    </div>

    <script>
        if (document.head) {
            let link = document.createElement('link');
            link.rel = 'icon';
            link.href = '/favicon.ico';
            document.head.appendChild(link);
        }
    </script>
</body>

</html>
