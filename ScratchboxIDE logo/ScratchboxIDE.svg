    <path d="M 38 20 L 46 30 L 38 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="32" y1="18" x2="28" y2="42" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <!-- Text Branding -->
  <text x="82" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="1.2">SCRATCHBOX</text>
  <!-- IDE Badge -->
  <rect x="290" y="24" width="58" height="26" rx="6" fill="#3b82f6" />
  <text x="319" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">IDE</text>
</svg>
